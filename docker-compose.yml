# OpenMAIC SaaS (feat/saas) — app + worker + Redis + local object storage.
#
# Self-hosted Supabase (Postgres + GoTrue + Storage + Realtime) runs SEPARATELY
# (supabase CLI `supabase start` or the official self-host compose). The app +
# worker reach it via `.env.local` (DATABASE_URL + NEXT_PUBLIC_SUPABASE_* +
# SUPABASE_SERVICE_ROLE_KEY). This compose only adds what Supabase does NOT provide:
# Redis (BullMQ generation queue) and, until Stage D, a local S3 (MinIO).
#
# Dev:   docker compose up -d redis minio     then `pnpm dev` (Supabase elsewhere)
# Full:  docker compose --profile app up -d   (app + worker, alongside Supabase)
services:
  minio:
    image: minio/minio:latest
    container_name: openmaic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openmaic
      MINIO_ROOT_PASSWORD: openmaic123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openmaic-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      args:
        - NEXT_PUBLIC_PERSISTENCE=${NEXT_PUBLIC_PERSISTENCE:-}
        - NEXT_PUBLIC_PERSISTENCE_TOKEN=${NEXT_PUBLIC_PERSISTENCE_TOKEN:-}
        - NEXT_PUBLIC_MAIC_EDITOR_ENABLED=${NEXT_PUBLIC_MAIC_EDITOR_ENABLED:-}
        - NEXT_PUBLIC_PI_CHAT_ENABLED=${NEXT_PUBLIC_PI_CHAT_ENABLED:-}
        - NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI=${NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI:-}
        - NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=${NEXT_PUBLIC_ENABLE_VIDEO_EXPORT:-}
        - NEXT_PUBLIC_ENABLE_PPTX_IMPORT=${NEXT_PUBLIC_ENABLE_PPTX_IMPORT:-}
    container_name: openmaic-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # In-compose override; Supabase + DB + storage creds come from .env.local.
      REDIS_URL: redis://redis:6379
      RENDER_SERVICE_URL: http://render-service:9000
    networks:
      - default
      - render
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    container_name: openmaic-worker
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped

  # Isolated MP4 render service (Node 22 + Chromium + FFmpeg) for classroom video
  # export (issue #866). Opt-in: only starts with `--profile video-export`, since
  # the image is heavy (bundles Chromium + FFmpeg) and the capability is optional.
  #
  #   docker compose --profile video-export up --build
  #
  # Sits on the `render` network (`internal: true`, no host/internet gateway).
  # It shares that network with `app` only so the UI container can reach it; to stop
  # the untrusted Chromium from initiating connections *back* to the app over
  # that shared network, the container's entrypoint installs an iptables egress
  # lockdown (needs CAP_NET_ADMIN) that drops all outbound except loopback and
  # replies on app-initiated connections. The export ZIP is self-contained, so
  # the render needs no outbound at all.
  render-service:
    build: ./render-service
    profiles:
      - video-export
    expose:
      - "9000"
    # Required for the entrypoint's iptables egress lockdown. Without it the
    # service still boots, but logs a warning and does NOT block Chromium egress.
    cap_add:
      - NET_ADMIN
    environment:
      - PORT=9000
      # Use Chromium's HeadlessExperimental.beginFrame capture path instead of
      # the CPU-bound Page.captureScreenshot fallback. The default "software" GPU
      # mode (SwiftShader) silently force-enables screenshot capture, which pegs
      # all cores on CPU rasterization and caps throughput at ~10 fps. Selecting
      # "hardware" keeps beginFrame active — measured ~2x capture throughput
      # (~10 -> ~19 fps, 900-frame clip 100s -> 62s), roughly half the CPU, and
      # pixel-identical static frames (animation frames differ only in sub-pixel
      # edge antialiasing). No real GPU is required: the win is the faster capture
      # API, not hardware rasterization — beginFrame falls back gracefully if the
      # host lacks a GPU.
      - PRODUCER_BROWSER_GPU_MODE=hardware
      # Tune for the host; each concurrent render drives a full Chromium + FFmpeg.
      - RENDER_MAX_CONCURRENCY=2
      # In this default topology the app is exposed directly and does NOT set
      # TRUST_PROXY_HEADERS, so every caller collapses to one identity. A
      # per-identity limit would then throttle the whole deployment to a single
      # render, so disable it here and rely on RENDER_MAX_CONCURRENCY + the global
      # RENDER_MAX_QUEUE cap. Set this >0 only with a trusted proxy supplying
      # per-user identity (see render-service/README.md).
      - RENDER_MAX_JOBS_PER_USER=0
    # Bound RAM: each render (Chromium + FFmpeg + archive expansion) is memory
    # heavy, and extraction is capped separately (RENDER_MAX_CONCURRENT_EXTRACTIONS).
    # Raise for higher RENDER_MAX_CONCURRENCY / larger classrooms.
    mem_limit: 4g
    networks:
      - render
    restart: unless-stopped

networks:
  default: {}
  # Isolated network for app <-> render-service traffic. `internal: true` means
  # no route to the host or internet. Both services share it so the app can
  # reach the render service; the render container additionally blocks its own
  # egress (iptables, see the service's entrypoint) so the untrusted Chromium
  # can't use this shared network to reach the app.
  render:
    internal: true

volumes:
  miniodata:
  redisdata:
  openmaic-data:
