name: Desktop Release

on:
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate desktop release candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.11.0

      - name: Require the current desktop release branch head
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/feat/tauri-desktop" ]; then
            echo "::error::Desktop releases must be dispatched from feat/tauri-desktop."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/feat/tauri-desktop:refs/remotes/origin/feat/tauri-desktop"
          branch_head="$(git rev-parse refs/remotes/origin/feat/tauri-desktop)"
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing stale commit $GITHUB_SHA; current branch head is $branch_head."
            exit 1
          fi

      - name: Verify desktop version
        run: node scripts/check-desktop-versions.mjs
        env:
          DESKTOP_RELEASE: "1"

      - name: Require complete CI for this commit
        run: node scripts/check-desktop-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: Sign and publish desktop release
    needs: authorize
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Recheck the approved branch head and CI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "+refs/heads/feat/tauri-desktop:refs/remotes/origin/feat/tauri-desktop"
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh feat/tauri-desktop.' }
          $branchHead = (git rev-parse refs/remotes/origin/feat/tauri-desktop).Trim()
          if ($branchHead -ne $env:GITHUB_SHA) {
            throw "The approved commit is stale; current branch head is $branchHead."
          }
          node scripts/check-desktop-ci.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Complete CI verification failed.' }

      - name: Resolve and verify desktop version
        shell: pwsh
        env:
          DESKTOP_RELEASE: "1"
        run: |
          node scripts/check-desktop-versions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop version verification failed.' }
          $version = (node -p "require('./package.json').version").Trim()
          "DESKTOP_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DESKTOP_RELEASE_TAG=desktop-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Refuse an existing release marker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingTag = git ls-remote --tags origin "refs/tags/$env:DESKTOP_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing desktop tags.' }
          if ($existingTag) { throw "Tag $env:DESKTOP_RELEASE_TAG already exists." }
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing desktop releases.' }
          $existingRelease = @($releasesJson | ConvertFrom-Json) `
            | Where-Object tag_name -eq $env:DESKTOP_RELEASE_TAG
          if ($existingRelease) { throw "Release $env:DESKTOP_RELEASE_TAG already exists." }

      - run: pnpm install --frozen-lockfile

      - name: Verify pinned Node sidecar
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1

      - name: Load Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'The desktop-release environment is missing WINDOWS_CERTIFICATE_BASE64.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'openmaic-desktop-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" `
            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and sign desktop installer
        shell: pwsh
        env:
          DESKTOP_RELEASE: "1"
          OPENMAIC_SIGNING_REQUIRED: "1"
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'The desktop-release environment is missing WINDOWS_CERTIFICATE_PASSWORD.'
          }
          pnpm exec tauri build --ci
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE." }

      - name: Verify Authenticode signatures
        id: verify
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $signedFiles = @(
            $installers[0].FullName,
            (Resolve-Path 'src-tauri/target/release/openmaic-desktop.exe').Path,
            (Resolve-Path 'src-tauri/binaries/node-x86_64-pc-windows-msvc.exe').Path
          )
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for ${file}: $($signature.Status)"
            }
            Write-Host "Valid Authenticode signature: $file ($($signature.SignerCertificate.Subject))"
          }
          "installer=$($installers[0].FullName)" `
            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force
          }

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $assetsDirectory = Join-Path $env:RUNNER_TEMP 'desktop-release-assets'
          New-Item -ItemType Directory -Path $assetsDirectory -Force | Out-Null
          $installerName = "OpenMAIC-Desktop_$env:DESKTOP_RELEASE_VERSION`_x64-setup.exe"
          $installerPath = Join-Path $assetsDirectory $installerName
          Copy-Item -LiteralPath '${{ steps.verify.outputs.installer }}' -Destination $installerPath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $assetsDirectory 'SHA256SUMS.txt'),
            "$hash  $installerName`n",
            [Text.Encoding]::ASCII
          )
          "directory=$assetsDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_name=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DESKTOP_RELEASE_TAG }}-signed
          path: ${{ steps.assets.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Stage and verify draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          $visibility = (gh api "repos/$env:GITHUB_REPOSITORY" --jq '.visibility').Trim()
          if ($visibility -ne 'public') {
            throw "Public desktop assets require a public repository; visibility is $visibility."
          }
          $assets = @(Get-ChildItem -LiteralPath $env:ASSETS_DIRECTORY | ForEach-Object FullName)
          gh release create $env:DESKTOP_RELEASE_TAG @assets `
            --draft `
            --target $env:GITHUB_SHA `
            --title "OpenMAIC Desktop $env:DESKTOP_RELEASE_VERSION" `
            --notes "Approved Authenticode-signed Windows x64 Desktop Release."
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }

          $release = gh release view $env:DESKTOP_RELEASE_TAG --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release became public before asset verification.' }
          $actualAssets = @($release.assets | ForEach-Object name | Sort-Object)
          $expectedAssets = @($assets | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object)
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Draft release assets do not match the approved asset set."
          }
          $unexpectedTag = git ls-remote --tags origin "refs/tags/$env:DESKTOP_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the draft release tag state.' }
          if ($unexpectedTag) { throw 'The release tag was created before draft approval completed.' }

      - name: Publish release and verify public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_DIRECTORY: ${{ steps.assets.outputs.directory }}
          INSTALLER_NAME: ${{ steps.assets.outputs.installer_name }}
        run: |
          gh release edit $env:DESKTOP_RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the approved draft release.' }

          $release = gh release view $env:DESKTOP_RELEASE_TAG --json isDraft,url,assets | ConvertFrom-Json
          if ($release.isDraft) { throw 'Desktop release is still a draft.' }
          git fetch --force origin "refs/tags/$env:DESKTOP_RELEASE_TAG:refs/tags/$env:DESKTOP_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Published release tag is unavailable.' }
          $tagCommit = (git rev-parse "$env:DESKTOP_RELEASE_TAG^{commit}").Trim()
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag points to $tagCommit instead of $env:GITHUB_SHA."
          }

          $installerAsset = $release.assets | Where-Object name -eq $env:INSTALLER_NAME
          $checksumAsset = $release.assets | Where-Object name -eq 'SHA256SUMS.txt'
          if (-not $installerAsset -or -not $checksumAsset) {
            throw 'Published release is missing the installer or checksum asset.'
          }
          $publicInstaller = Join-Path $env:RUNNER_TEMP $env:INSTALLER_NAME
          $publicChecksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.public.txt'
          curl.exe --fail --silent --show-error --location --retry 10 --retry-all-errors `
            --output $publicInstaller $installerAsset.url
          if ($LASTEXITCODE -ne 0) { throw 'Public installer download failed.' }
          curl.exe --fail --silent --show-error --location --retry 10 --retry-all-errors `
            --output $publicChecksums $checksumAsset.url
          if ($LASTEXITCODE -ne 0) { throw 'Public checksum download failed.' }

          $expectedChecksums = Get-Content -Raw (Join-Path $env:ASSETS_DIRECTORY 'SHA256SUMS.txt')
          $actualChecksums = Get-Content -Raw $publicChecksums
          if ($actualChecksums -ne $expectedChecksums) {
            throw 'Public checksum file differs from the approved asset.'
          }
          $expectedHash = ($expectedChecksums -split '\s+')[0]
          $publicHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $publicInstaller).Hash.ToLowerInvariant()
          if ($publicHash -ne $expectedHash) {
            throw "Public installer checksum mismatch: expected $expectedHash, received $publicHash."
          }
          Write-Host "Published and verified $($release.url)"
